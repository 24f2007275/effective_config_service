services:
  - type: web
    name: effective-config-service
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_DEBUG
        value: "true"
      - key: APP_LOG_LEVEL
        value: warning
      - key: APP_API_KEY
        value: key-ligs106mnj
